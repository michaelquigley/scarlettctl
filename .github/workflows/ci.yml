name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev

      - name: Test with race detection and vet
        run: make test GOFLAGS=-race

      - name: Build
        run: make build
        env:
          GOBIN: ${{ runner.temp }}/scarlettctl-bin
